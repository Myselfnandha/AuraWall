[metadata]
name = awall
version = 0.1.0
description = Free Automatic Wallpaper Engine for Arch Linux
author = awall contributors
license = MIT
license_files = LICENSE
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
python_requires = >=3.10
install_requires =
    pyyaml>=6.0
    requests>=2.28.0
    Pillow>=9.0.0
    PyGObject>=3.42.0

[options.package_data]
awall =
    assets/*.png

[options.packages.find]
include =
    awall
    awall.*

[options.entry_points]
gui_scripts =
    awall = awall.cli:main
console_scripts =
    awall-cli = awall.cli:main
