[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurawall"
version = "0.1.0"
description = "🌌 Next-generation wallpaper engine & desktop ambiance daemon for Linux"
readme = "README.md"
authors = [{ name = "Myselfnandha", email = "nandha@users.noreply.github.com" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Wayland",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment",
]
keywords = ["wallpaper", "wallpaper-engine", "wallhaven", "bing", "unsplash", "arch-linux", "hyprland", "sway", "xfce", "gnome", "kde"]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "Pillow>=9.0.0",
    "PyGObject>=3.42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
aurawall = "awall.cli:main"
awall = "awall.cli:main"

[project.gui-scripts]
aurawall = "awall.cli:main"
awall = "awall.cli:main"

[project.urls]
Homepage = "https://github.com/Myselfnandha/AuraWall"
Repository = "https://github.com/Myselfnandha/AuraWall"
"Bug Tracker" = "https://github.com/Myselfnandha/AuraWall/issues"
